    timeout_s: 21600                # SCRAPE_TIMEOUT_S default, 6h (no VA-specific entry)
    session_arg: null                # ALWAYS null for secondaries (OPEN-24 resolution)
    votes_scraper: false
    start_filter: true                # max(EventDate) from events call; events call unavoidable,
                                       # saves 3 of 4 per-bill calls
    sweep_import: true              # SYNC-157: ddp-sync's import-as-you-go sweep (was sync_schedule.yaml sweep_import.jurisdictions)
    full_walk: false                 # SYNC-157: periodic forced full walk, when ddp-sync's full_walk.enabled is on (was full_walk.jurisdictions)
    retry: false                     # SYNC-157: bounded whole-run retry (was scrape_retry.jurisdictions); refused with a WAF (OPEN-53)
    cadence_escalation: true          # SYNC-157: dynamic cadence may raise it to nightly (was dynamic_cadence.jurisdictions_excluded, empty)
    fargate_max_wait_s: null             # SYNC-157: this state's own Fargate ceiling, null = ddp-sync's shared max_wait_seconds
    load_on_fargate: false              # OPEN-633: ddp-sync runs this state's load as a Fargate task (false = the local load, as before)
