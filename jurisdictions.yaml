                                   # added (65363ef)
    timeout_s: 21600                # SCRAPE_TIMEOUT_S default, 6h (no VA-specific entry)
    session_arg: null                # ALWAYS null for secondaries (OPEN-24 resolution)
    votes_scraper: false
    start_filter: true                # max(EventDate) from events call; events call unavoidable,
