  status: live
  tier: secondary                # ddp-sync openstates_scrape.secondary (Sunday weekly batch)
  scrape:
    allow_duplicates: true         # pagination overlap (upstream #5697)
    timeout_s: 36000                 # SCRAPE_TIMEOUT_S["mi"], 10h -- MI also gets a periodic
