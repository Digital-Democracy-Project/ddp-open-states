# ddp-open-states/jurisdictions.yaml — single source of truth for tracked jurisdictions.
#
# OPEN-318 (2026-10-05): this file also says which per-feature lists each jurisdiction is on (the
# `enrollment:` block, plus archive.enabled), populated from the lists' real values that day, and
# check-jurisdiction-drift.py (run in CI, see .github/workflows/validate-jurisdictions.yml) fails when any
# hard-coded list -- this repo's, or ddp-sync's sync_schedule.yaml and timeout tables -- disagrees with it.
# Since OPEN-327 (2026-10-21) this repo's own scripts READ it instead of keeping a list: activate.sh
# (ARCHIVE_ENABLED_STATES = archive.enabled), run-people-refresh.sh (enrollment.people_refresh),
# start-os-api.sh (enrollment.api_smoke_test), run-scrape.sh (scrape.allow_duplicates) and quality_check.py
# (enrollment.qa_sweep, and its OCD id table), and the drift check fails if one grows a list again.
# ddp-sync, the broker, votebot and ddp-agents are still comparison-only (OPEN-328, OPEN-329). To add a
# state or enroll one in a feature, edit this file first
# (RUNBOOK.md -> "Adding a jurisdiction, or enrolling one in a feature"). `python3
# check-jurisdiction-drift.py --matrix` prints who is enrolled in what. `al` was added then: it is on the
# archive, people-refresh and QA lists, so it belongs here (status paused: its bills are not scraped).
#
# Moving a state forward (2026-11-03): do not hand-edit the status and its flags. `advance-jurisdiction <st> scraping|live`
# sets status plus the flags that status needs (people_refresh, archive.enabled, cloud_path),
# and validate_jurisdictions.py refuses a state past `probing` that lacks them. LegBot (legbot_replica), embedding and
# routing are never set by it: they stay human decisions.
#
# OPEN-221 / PLAN-push-button-onboarding.md §4.1 ("Manifest v0"). This is deliberately a SMALL
# first step: the file + validate_jurisdictions.py + jurisdiction-field.sh, consumed ONLY by
# ddp-open-states scripts and the onboarding probe (this repo's scripts were wired in by OPEN-327, see
# above). It is NOT consumed by ddp-sync, ddp-broker-py, ddp-next, or votebot — those repos keep their
# own existing lists as documentation-of-record for now (see the plan's §4.1 "consumer expansion"
# table); wiring them is OPEN-328 and OPEN-329.
#
# The 8 entries below are the jurisdictions already tracked in production as of 2026-08-30 --
# they onboarded before this manifest existed, so `status: live` and a null `onboarding` block
# reflect "already done", not "not started". A jurisdiction going through the real Stage 0-6
# runbook (PLAN-push-button-onboarding.md §5) would start at `status: probing` and fill in
# `onboarding.epic` / `onboarding.evidence` as it progresses.
#
# Deliberate deviation from the plan's original §4.1 example schema: this file has NO
# `quality.walk_direction` field. The plan's own 2026-08-07 update says that field (and the
# walk-direction half of probe gate F) is "obsolete -- do not build it", superseded by OPEN-34's
# durable content-based version-stage classifier (`_note_stage()`/`_version_sort_key()` in
# openstates-core/openstates/utils/version_ordering.py). `quality.diff_cleaner` is kept -- that
# part of §4.1/§4.3 was not superseded.
#
# `scrape.session_arg` is `null` for every entry here, including fl/us which DO run explicit,
# multiple session invocations in production -- but that's a *list* of sessions owned by
# ddp-sync's own scheduler config (config/sync_schedule.yaml), not a single per-jurisdiction
# override. Per this repo's own per-jurisdiction-config convention (PRIMITIVES.md, OPEN-124),
# "who is enrolled in a rollout, on what schedule" is scheduler-owned, not wrapper/manifest-owned
# -- so this field stays reserved for a genuine single-session override and unused for fl/us.
# For every other jurisdiction this null is also OPEN-24's resolution: ddp-sync deliberately
# passes no session arg, so every active session gets scraped.
#
# OPEN-521 (PLAN-push-button-onboarding.md "One pipeline per state", 2026-11-10): there is no `tier`
# and no `archive.scheduled` any more, and the validator rejects both. ddp-sync reads two things from
# this file to run its one pipeline per state (scrape, then archive, then LegBot):
#   - WHO is scraped: every state whose status is not probing or paused;
#   - whether the archive follows that scrape: archive.enabled.
# WHEN a state is scraped (nightly or weekly, which day, what time) is ddp-sync's own
# openstates_scrape.timing, timing only, never a list of who (OPEN-124: timing belongs to the
# scheduler). check-jurisdiction-drift.py fails if that timing map names a state this file does not
# scrape.
#
# BROKER-368 (2026-11-12): two per-state facts the broker kept in its own code move here, and the broker
# reads them from api-v3's GET /ddp/enrollment (its one reader of this file, ddpbroker/enrollment.py), so no
# service keeps a copy (Ramon: "every service must read from the canonical manifest of jurisdictions"):
#   - actions.newest_first: OpenStates lists this state's bill actions newest first (us, nc; checked by the
#     broker's validate_bill_stages command). Was the broker's NEWEST_FIRST_JURISDICTIONS.
#   - voatz.creator_id / voatz.test_precinct: the Voatz poll creatorId and the test precinct, null when
#     unknown (a poll, or a test poll, is then refused). Not secret. Was the broker's CREATOR_IDS (keyed by
#     Voatz organization id: 800000075 = fl, 800000097 = us, 800000115 = va) and TEST_PRECINCTS. Ramon
#     supplies new ids; none is guessed.
#
# SYNC-157 (2026-11-12): ddp-sync keeps no list of states of its own any more; it reads these (values copied from its
# sync_schedule.yaml that day): scrape.sweep_import, scrape.full_walk, scrape.retry (never with a WAF profile, OPEN-53),
# scrape.cadence_escalation, scrape.fargate_max_wait_s (null = ddp-sync's shared Fargate wait), waf.scrapebot_fallback and
# enrollment.broker_bill_event_signal, plus scrape.timeout_s / archive.timeout_s and the cloud_path, embedding,
# search_refresh and legbot_replica enrollments. ddp-sync's global switches (`enabled`) and numbers stay in its own file.
#
# Every value below was pulled from the real running config on 2026-08-30, not guessed:
#   - scrape.timeout_s / archive.timeout_s: ddp-sync's SCRAPE_TIMEOUT_S / ARCHIVE_TIMEOUT_S dicts
#     (src/ddp_sync/pipelines/openstates_scrape.py, openstates_archive.py)
#   - archive.enabled: activate.sh's ARCHIVE_ENABLED_STATES; since OPEN-521 also "this state's scrape is
#     followed by its archive" in ddp-sync's pipeline (required from `scraping` on)
#   - scrape.allow_duplicates: run-scrape.sh's --allow_duplicates states (mi, fl, va)
#   - scrape.votes_scraper: whether the jurisdiction's own openstates-scrapers `__init__.py`
#     registers a live (non-commented) "votes" entry in its `scrapers = {...}` dict -- only `ma`
#     does (MAVoteScraper); `usa`'s is present but commented out. run-scrape.sh has auto-detected
#     and invoked this at runtime since OPEN-50 shipped, so this field is documentation, not a
#     read path (yet) -- see the "not wired in" note above.
#   - scrape.start_filter: RUNBOOK.md's "Per-jurisdiction caveats" table, corrected for OPEN-128
#     (MA's incremental filter was deleted 2026-08-25 -- MA now ignores start= and full-walks
#     every run, so it is `false` here despite the stale RUNBOOK table still listing a caveat)
#   - waf.profile: openstates-core/openstates/utils/resilience_profiles.py's RESILIENCE_PROFILES
#     dict (currently `mi` and `fl` only). check-jurisdiction-drift.py compares this field (every
#     code with profile != "none") against that dict's keys when given --openstates-core-root.
#   - waf.fargate_safe (OPEN-464): a SEPARATE question from waf.profile -- whether this
#     jurisdiction's WAF cookie can be produced from an arbitrary cloud IP (Fargate), not which WAF
#     implementation it uses. mi and fl share waf.profile: cookie_provider but answer this
#     differently: fl's cookie_provider does a Playwright warm-up in-process, wherever the scraper
#     runs; mi's can only be reliably minted by the Mac (ScrapeBot/CAMS publishes it on a
#     schedule -- see cloud_collector.py/cloud_archiver.py's own `if state == "mi"` gates, which
#     stay hard-coded by design, not read from this field -- OPEN-318's scoping note already
#     excludes "genuinely code" per-state behaviour like that). verify-jurisdiction's
#     fargate_refusal() and probe-on-fargate both refuse a state on Fargate when this is false,
#     instead of each keeping their own hard-coded set.
#   - quality.diff_cleaner: openstates-core/openstates/cli/text_extract.py's apply_prediff_cleaning()
#     per-jurisdiction dispatch (_clean_wa_text, _clean_virginia_text, _clean_michigan_text,
#     _reflow_paragraphs for az, _clean_al_text, _clean_nc_text, _clean_massachusetts_text; fl's
#     only per-jurisdiction check there is an unrelated TLS-cipher workaround, not a cleaner).
#     NOT documentation only: check-jurisdiction-drift.py (--openstates-core-root) parses that
#     dispatch directly (an AST walk, not a second hand-kept table) and fails CI when a value here
#     disagrees with it, same as every other field in this header. OPEN-462 (2026-10-30) found this
#     manifest said `none` for ma/nc/al while the code already cleaned all three and corrected it.
#   - api_keys: PRIMITIVES.md's "per-jurisdiction credentials" table (va requires VA_API_KEY; usa
#     optionally reads CONGRESS_GOV_API_KEY)

us:
  name: United States (Congress)
  status: live
  scrape:
    allow_duplicates: false
    timeout_s: 14400        # SCRAPE_TIMEOUT_S["usa"], 4h
    session_arg: null        # explicit "119 chamber=lower"/"119 chamber=upper" sessions are
                              # scheduler-owned (ddp-sync sync_schedule.yaml), see header note
    votes_scraper: false      # "votes": USVoteScraper is registered but commented out in
                              # scrapers/usa/__init__.py -- not actually invoked today
    start_filter: true        # GovInfo sitemap lastmod -- clean server-side filter, no caveat
    sweep_import: false              # SYNC-157: ddp-sync's import-as-you-go sweep (was sync_schedule.yaml sweep_import.jurisdictions)
    full_walk: false                 # SYNC-157: periodic forced full walk, when ddp-sync's full_walk.enabled is on (was full_walk.jurisdictions)
    retry: false                     # SYNC-157: bounded whole-run retry (was scrape_retry.jurisdictions); refused with a WAF (OPEN-53)
    cadence_escalation: true          # SYNC-157: dynamic cadence may raise it to nightly (was dynamic_cadence.jurisdictions_excluded, empty)
    fargate_max_wait_s: null             # SYNC-157: this state's own Fargate ceiling, null = ddp-sync's shared max_wait_seconds
  archive:
    enabled: true
    timeout_s: 86400          # ARCHIVE_TIMEOUT_S["us"], 24h -- sized for cold-backfill runs
  enrollment:
    people_refresh: true
    search_refresh: true
    embedding: true
    cloud_path: true
    api_smoke_test: true
    qa_sweep: false
    replica_routing: true    # DDP_OPENSTATES_JURISDICTIONS (ddp-broker-py and ddp-sync): reads served from DDP's replica, not public OpenStates
    legbot_replica: true    # LEGBOT_RDS_REPLICA_JURISDICTION_ALLOWLIST (ddp-sync): LegBot may read this jurisdiction's text from the replica
    broker_bill_event_signal: false    # SYNC-157: ddp-sync signals the broker's bill-event check after a scrape (was broker_bill_event_signal.jurisdictions, empty)
  waf:
    profile: none
    fargate_safe: true
    scrapebot_fallback: false    # SYNC-157: ScrapeBot cookie mint before scrape and archive (was ddp-sync's two scrapebot_fallback.jurisdictions lists)
  quality:
    diff_cleaner: none
  actions:
    newest_first: true    # OpenStates lists this state's bill actions newest first (BROKER-368; was the broker's NEWEST_FIRST_JURISDICTIONS)
  voatz:
    creator_id: null         # Voatz poll creatorId (BROKER-368; was the broker's CREATOR_IDS)
    test_precinct: FEDERAL-TEST    # Voatz test precinct (BROKER-368; was the broker's TEST_PRECINCTS)
  api_keys: ["CONGRESS_GOV_API_KEY"]   # optional -- degrades (events only) if absent, never fails
  onboarding:
    epic: null                # predates this manifest / the onboarding runbook
    evidence: null

