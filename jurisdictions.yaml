    diff_cleaner: clean_virginia_text  # 6 distinct artifact classes stripped (_clean_virginia_text)
  api_keys: ["VA_API_KEY"]              # required; scrape-time failure with a good message if
                                         # absent (VA already carries upstream's own good-failure
                                         # pattern -- see PRIMITIVES.md)
  onboarding:
    epic: null
    evidence: null

