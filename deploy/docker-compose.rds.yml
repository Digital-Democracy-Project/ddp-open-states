# INFRA-1: api-v3 pointed at the real ddp-openstates RDS instance, run on the same box as
# production ddp-broker (10.0.0.11) rather than the Mac Studio. Deliberately self-contained --
# INFRA-1's whole premise is that api-v3 has no real dependency on the Mac or on CAMS's
# infrastructure, so unlike docker-compose.ddp.yml (Mac-hosted, reuses CAMS's Redis) this stack
# brings its own Redis and does not attach to any pre-existing external network. It should stand
# up cleanly on a bare box with nothing else already running.
#
# OPEN-279: credentials are resolved LIVE from Secrets Manager at connection time
# (RESOLVE_RDS_LIVE=true), not baked into a static DATABASE_URL at container start. RDS's own
# "manage master credentials in Secrets Manager" feature rotates this password every 7 days --
# a value baked into DATABASE_URL at container start (the old approach here, via
# deploy/rotate-database-url.sh's rendered .env) goes stale on that cadence regardless of how
# recently the container started, and needed a manual script rerun + restart every time it
# did. This container's own api/db/__init__.py now re-resolves the credential from Secrets
# Manager whenever the connection pool opens a NEW physical connection (never later than one
# pool_recycle interval, 7200s/2h, from whenever the secret actually rotated) -- see that
# module and api/rds_credentials.py for the mechanism.
#
# Requires this host's IAM role/instance profile to have secretsmanager:GetSecretValue scoped
# to RDS_CREDENTIALS_SECRET_ARN below (the same grant OPEN-260 already required for ddp-sync's
# equivalent fix) -- a new grant if this host didn't already have it for another reason.
#
# .env (never committed) supplies just RDS_CREDENTIALS_SECRET_ARN below -- everything else
# needed to connect (host/port/dbname) is fixed and doesn't rotate, so it's a plain value here,
# not a secret.
name: ddp-openstates-rds

services:
  api:
    build:
      context: ../api-v3
      dockerfile: ../deploy/Dockerfile.ddp
    image: ddp-openstates-api:local
    container_name: ddp-openstates-api-1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      RESOLVE_RDS_LIVE: "true"
      RDS_CREDENTIALS_SECRET_ARN: "${RDS_CREDENTIALS_SECRET_ARN}"
      RDS_HOST: "ddp-openstates.cvxdhm1ogxug.us-east-1.rds.amazonaws.com"
      RDS_PORT: "5432"
      RDS_DBNAME: "openstates"
      AWS_REGION: "us-east-1"
      RRL_REDIS_HOST: "redis"
      RRL_REDIS_PORT: "6379"
      RRL_REDIS_DB: "1"
      WEB_CONCURRENCY: "4"
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "0.0.0.0:8002:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:80/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # api-v3's own rate-limiter Redis -- not CAMS's ddp-agents-redis-1. The upstream api-v3
  # docker-compose.yml already ships exactly this service; reusing CAMS's instance
  # (docker-compose.ddp.yml's approach) was only ever a same-Mac convenience, not a
  # requirement -- see INFRA-1.
  redis:
    image: redis
    container_name: ddp-openstates-redis-1
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
